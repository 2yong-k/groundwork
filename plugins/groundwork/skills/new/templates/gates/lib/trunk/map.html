<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trunk map</title>
<style>
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --surface-2: #efede7;
    --border: #d8d5cb;
    --text: #1f1e1a;
    --text-2: #5d5b53;
    --text-3: #8b887e;
    --accent: #17607d;
    --ok: #2b7a4b;
    --warn: #b0530c;
    --hold: #8b887e;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614;
      --surface: #1f1e1b;
      --surface-2: #2a2926;
      --border: #3a3935;
      --text: #ecebe5;
      --text-2: #aeaba1;
      --text-3: #7d7a71;
      --accent: #5db4d6;
      --ok: #5cc084;
      --warn: #e8935a;
      --hold: #7d7a71;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614;
    --surface: #1f1e1b;
    --surface-2: #2a2926;
    --border: #3a3935;
    --text: #ecebe5;
    --text-2: #aeaba1;
    --text-3: #7d7a71;
    --accent: #5db4d6;
    --ok: #5cc084;
    --warn: #e8935a;
    --hold: #7d7a71;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 32px; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
  main { max-width: 1120px; margin: 0 auto; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .root { color: var(--text-2); font-family: var(--mono); font-size: 12px; margin: 0 0 14px; overflow-wrap: anywhere; }
  .viz { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .canvas { flex: 1 1 560px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .side-col { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 13px; }
  .panel h2 { font-size: 14px; margin: 0 0 8px; }
  .panel dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
  .panel dt { color: var(--text-2); white-space: nowrap; }
  .panel dd { margin: 0; overflow-wrap: anywhere; }
  .panel .foot { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); color: var(--text-2); }
  .warn { color: var(--warn); }
  .ok { color: var(--ok); }
  .muted { color: var(--text-2); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .legend { color: var(--text-2); font-size: 12px; margin: 6px 4px 2px; }
  .empty { color: var(--text-2); padding: 18px 8px; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 1px 0; overflow-wrap: anywhere; }
  .repo { margin-top: 8px; }
  .repo b { font-family: var(--mono); font-weight: 600; }
  details.ms { margin: 0 0 4px; }
  details.ms summary { cursor: pointer; }
  details.ms ul { margin: 4px 0 0; }
  button.link { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  button.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #chart { overflow-x: auto; }
  svg { width: 100%; height: auto; display: block; }
  /* the drawing never scales below 1, so its 12px labels stay 12px; a narrow window scrolls the chart instead */
  svg text { font-family: var(--sans); font-size: 12px; fill: var(--text); }
  svg text.s { font-size: 10.5px; fill: var(--text-2); }
  svg text.b { font-weight: 600; }
  svg text.w { fill: var(--warn); }
  svg text.g { fill: var(--ok); }
  svg .trunk { stroke: var(--text); stroke-width: 3; fill: none; }
  svg .ln { fill: none; stroke-width: 2.5; stroke-linecap: round; }
  svg .ln.default { stroke: var(--accent); }
  svg .ln.gray { stroke: var(--hold); stroke-dasharray: 5 4; }
  svg .ln.orange { stroke: var(--warn); }
  svg .ln.green { stroke: var(--ok); }
  svg .now { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 4; }
  svg .node { fill: var(--text); }
  svg .node.next { fill: var(--surface-2); stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 4 3; }
  svg .patch { fill: var(--surface-2); stroke: var(--accent); stroke-width: 1.5; }
  svg .dot-default { fill: var(--accent); }
  svg .dot-gray { fill: var(--hold); }
  svg .dot-orange { fill: var(--warn); }
  svg .dot-green { fill: var(--ok); }
  svg .side { cursor: pointer; }
  svg .side:focus { outline: none; }
  svg .side:focus-visible .hit, svg .side.on .hit { fill: var(--surface-2); }
  svg .hit { fill: transparent; }
</style>
</head>
<body>
<main>
  <h1>Trunk map</h1>
  <p class="root" id="root"></p>
  <div class="viz">
    <div class="canvas">
      <div id="chart"></div>
      <div class="legend">Small circle on the trunk = a release that went to prod between milestones · blue = in progress · green = in the trunk · orange = something left out of the trunk · gray dashed = waiting · on hold · click a side branch to open its commits · worktree · ledger IDs per repo</div>
    </div>
    <div class="side-col">
      <div class="panel" id="bundle"></div>
      <div class="panel" id="detail"></div>
    </div>
  </div>
</main>
<script type="application/json" id="trunk-data">
/*TRUNK_DATA*/
</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("trunk-data").textContent);
  var NS = "http://www.w3.org/2000/svg";
  var FLAGS = {
    "merged-open": "merged but not closed", "half-merged": "half merged", "aborted-merge": "aborted merge",
    "detached": "detached", "suspect": "suspect", "not-side": "not a side branch",
    "half-made": "rerun open to resume", "next-milestone": "waits for the next milestone"
  };
  function flagText(f) { return f.indexOf("shipped:") === 0 ? "already in prod via " + f.slice(8) : (FLAGS[f] || f); }
  function mk(tag, attrs, text, ns) {
    var e = ns ? document.createElementNS(NS, tag) : document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text != null) { e.textContent = text; }
    return e;
  }
  function add(parent, child) { parent.appendChild(child); return child; }
  function cut(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
  function mmdd(d) { return /^\d{4}-\d\d-\d\d$/.test(d) ? d.slice(5) : d; }
  function days(d) { var p = d.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000; }
  function validDate(d) { return /^\d{4}-\d\d-\d\d$/.test(d || ""); }
  function vkey(v) { var p = v.replace(/^v/, "").split("."); return (+p[0]) * 1e6 + (+p[1]) * 1e3 + (+p[2]); }
  function sideVer(s) { return /^tbd→/.test(s.milestone) ? s.milestone.slice(4) : (s.milestone === "tbd" || s.milestone === "-" ? "" : s.milestone); }

  document.getElementById("root").textContent = D.root + " · now " + mmdd(D.today);

  // This milestone: the earliest open one, else the version after the highest in the table.
  var open = D.milestones.filter(function (m) { return m.state === "open"; }).sort(function (a, b) { return vkey(a.version) - vkey(b.version); });
  var reached = D.milestones.filter(function (m) { return m.state === "reached"; });
  var thisVer = "";
  var thisRow = null;
  if (open.length) { thisRow = open[0]; thisVer = open[0].version; }
  else if (D.milestones.length) {
    var top = D.milestones.slice().sort(function (a, b) { return vkey(b.version) - vkey(a.version); })[0].version.replace(/^v/, "").split(".");
    thisVer = "v" + top[0] + "." + (+top[1] + 1) + ".0";
  }

  // x by date: linear in days, but never closer than GAP px so labels do not collide.
  var X0 = 70, GAP = 56, ROW = 36, TY = 96;
  var set = {};
  function want(d) { if (validDate(d)) { set[d] = 1; } }
  want(D.today);
  // A side of a reached milestone whose branch is gone is listed under that milestone, not drawn (history).
  var live = D.sides.filter(function (s) { return !s.history; });
  var past = D.sides.filter(function (s) { return s.history; });
  reached.forEach(function (m) { want(m.date); });
  D.releases.forEach(function (r) { want(r.date); });
  live.forEach(function (s) { want(s.start); });
  var ds = Object.keys(set).sort();
  var xs = {};
  var span = Math.max(1, days(ds[ds.length - 1]) - days(ds[0]));
  var k = Math.max(4, Math.min(30, 480 / span));
  var prev = null;
  ds.forEach(function (d) {
    var x = X0 + (days(d) - days(ds[0])) * k;
    if (prev !== null) { x = Math.max(x, prev + GAP); }
    xs[d] = x;
    prev = x;
  });
  // Labels sit left of the now line (up to LABEL px wide): in the first days the axis is too short for them, so
  // the whole axis moves right.
  var LABEL = 190;
  var shift = Math.max(0, LABEL + 8 - xs[D.today]);
  ds.forEach(function (d) { xs[d] += shift; });
  var nowX = xs[D.today];
  var nextX = nowX + 170;
  function xOf(d, fallback) { return validDate(d) && xs[d] != null ? xs[d] : fallback; }

  var rows = live.length;
  var H = TY + 54 + Math.max(1, rows) * ROW;
  var W = nextX + 130;
  // group, not img: an img's children are presentational, which would hide the side buttons from assistive tech.
  var svg = mk("svg", { viewBox: "0 0 " + W + " " + H, role: "group", "aria-label": "Trunk map: milestones " + D.milestones.length + ", side branches " + rows }, null, true);
  svg.style.minWidth = W + "px";

  add(svg, mk("line", { "class": "now", x1: nowX, y1: 24, x2: nowX, y2: H - 8 }, null, true));
  add(svg, mk("text", { "class": "s", x: nowX, y: 14, "text-anchor": "middle" }, "now " + mmdd(D.today), true));
  add(svg, mk("line", { "class": "trunk", x1: X0 - 30, y1: TY, x2: nextX - 10, y2: TY }, null, true));

  reached.forEach(function (m) {
    var x = xOf(m.date, X0);
    add(svg, mk("circle", { "class": "node", cx: x, cy: TY, r: 7 }, null, true));
    add(svg, mk("text", { "class": "b", x: x, y: TY - 14, "text-anchor": "middle" }, m.version, true));
    add(svg, mk("text", { "class": "s", x: x, y: TY + 24, "text-anchor": "middle" }, mmdd(m.date || ""), true));
  });
  D.releases.forEach(function (r) {
    var x = xOf(r.date, X0);
    var c = add(svg, mk("circle", { "class": "patch", cx: x, cy: TY, r: 4.5 }, null, true));
    add(c, mk("title", {}, r.tag + (r.repos.length && r.repos[0] !== "." ? " (" + r.repos.join(", ") + ")" : ""), true));
    var first = r.tag.split(",")[0].trim();
    add(svg, mk("text", { "class": "s", x: x, y: TY + 24, "text-anchor": "middle" }, first + (r.tag.indexOf(",") >= 0 ? " +" : ""), true));
  });
  if (thisVer) {
    add(svg, mk("circle", { "class": "node next", cx: nextX, cy: TY, r: 9 }, null, true));
    add(svg, mk("text", { "class": "b", x: nextX + 14, y: TY + 4 }, thisVer, true));
    add(svg, mk("text", { "class": "s", x: nextX + 14, y: TY + 18 }, "this milestone", true));
  }

  var detail = document.getElementById("detail");
  var groups = [];
  function select(s, g) {
    groups.forEach(function (o) { o.classList.remove("on"); });
    if (g) { g.classList.add("on"); }
    showDetail(s);
  }
  var merged = 0;
  // The latest start on the top row: a line that starts earlier runs down past the rows above it, not through them.
  var ordered = live.slice().sort(function (a, b) {
    var da = validDate(a.start) ? a.start : "9999", db = validDate(b.start) ? b.start : "9999";
    return da === db ? (a.name < b.name ? -1 : 1) : (da < db ? 1 : -1);
  });
  ordered.forEach(function (s, i) {
    var y = TY + 54 + i * ROW;
    var xStart = xOf(s.start, nowX - 120);
    var g = mk("g", { "class": "side", tabindex: "0", role: "button", "aria-label": s.name + " " + s.mark }, null, true);
    add(g, mk("rect", { "class": "hit", x: 0, y: y - 20, width: W, height: ROW - 2 }, null, true));
    var isMerged = s.mark === "✓"; // a side merged once and still open (◐) keeps running
    var endX = nowX;
    var rx = 0;
    if (isMerged) {
      // It rejoins the trunk before now, never left of where it started (a side opened and merged today).
      rx = Math.max(nowX - 26 - (merged % 4) * 12, Math.min(xStart + 40, nowX));
      merged += 1;
    }
    // The run below the trunk ends at stop; the curve down never passes it (a side opened today starts at now).
    var stop = isMerged ? rx - 24 : endX - 6;
    var cx = Math.min(xStart + 30, stop);
    var d = "M" + xStart + "," + TY + " C" + xStart + "," + (y - 40) + " " + Math.min(xStart + 8, cx) + "," + y + " " + cx + "," + y + " L" + stop + "," + y;
    if (isMerged) {
      d += " C" + rx + "," + y + " " + rx + "," + (y - 40) + " " + rx + "," + (TY + 6);
      add(g, mk("path", { "class": "ln " + s.class, d: d }, null, true));
      add(g, mk("circle", { "class": "dot-" + s.class, cx: rx, cy: TY, r: 4 }, null, true));
    } else {
      add(g, mk("path", { "class": "ln " + s.class, d: d }, null, true));
      add(g, mk("circle", { "class": "dot-" + s.class, cx: endX, cy: y, r: 5 }, null, true));
    }
    var cls = s.class === "orange" ? "w" : (s.class === "green" ? "g" : "");
    var lx = Math.max(8, Math.min(xStart + 36, nowX - LABEL));
    add(g, mk("text", { "class": "b " + cls, x: lx, y: y - 6 }, s.mark + " " + cut(s.name, 30), true));
    var meta = (s.repos.length && s.repos[0] !== "." ? s.repos.join(", ") + " · " : "") + (validDate(s.start) ? mmdd(s.start) + "~" : "");
    var shipped = s.flags.filter(function (f) { return f.indexOf("shipped:") === 0; }).map(flagText);
    meta += (meta && shipped.length ? " · " : "") + shipped.join(", ");
    if (meta) { add(g, mk("text", { "class": "s", x: lx, y: y + 10 }, cut(meta, 52), true)); }
    var right = "";
    if (s.class === "orange") { right = s.missing + " left out"; }
    else if (s.class === "gray" || s.class === "default") { right = s.status === "-" ? "" : s.status; }
    if (right) { add(g, mk("text", { "class": s.class === "orange" ? "w" : "s", x: nowX + 12, y: y + 4 }, cut(right, 30), true)); }
    g.addEventListener("click", function () { select(s, g); });
    g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(s, g); } });
    groups.push(g);
    add(svg, g);
  });
  var chart = document.getElementById("chart");
  if (!rows) { add(chart, mk("p", { "class": "empty" }, "No side branch to draw.")); }
  add(chart, svg);
  // A chart narrower than the drawing scrolls to the labels, the now line and the statuses beside it.
  if (chart.scrollWidth > chart.clientWidth) { chart.scrollLeft = Math.max(0, nowX - LABEL - 8); }

  // The panel beside the chart: what is in this milestone, what is left out, what tidy would remove.
  function dl(parent, label, value, cls) {
    add(parent, mk("dt", {}, label));
    var dd = add(parent, mk("dd", cls ? { "class": cls } : {}));
    if (typeof value === "string") { dd.textContent = value; } else { value(dd); }
  }
  var bundle = document.getElementById("bundle");
  add(bundle, mk("h2", {}, thisVer ? "Up to milestone " + thisVer : "Milestones"));
  var list = add(bundle, mk("dl"));
  var inBundle = live.filter(function (s) { return sideVer(s) === thisVer && thisVer; });
  dl(list, "Bundle", inBundle.length ? inBundle.map(function (s) { return s.mark + " " + s.name; }).join(" · ") : (D.milestones.length ? "no side branch" : "no milestone table"));
  dl(list, "staging QA", thisRow ? thisRow.qa || "-" : "-");
  var missing = D.sides.filter(function (s) { return s.missing > 0; });
  var total = missing.reduce(function (n, s) { return n + s.missing; }, 0);
  var loose = (D.loose || []).map(function (l) { return "repo " + l.key + " branchless stashes " + l.count; });
  dl(list, "Left out", missing.length || loose.length ? (total ? total + " (" + missing.map(function (s) { return s.name + " " + s.missing; }).join(" · ") + ")" : "") + (loose.length ? (total ? " · " : "") + loose.join(" · ") : "") : "none", missing.length || loose.length ? "warn" : "");
  var gone = D.tidy.filter(function (t) { return t.ok; });
  var stay = D.tidy.filter(function (t) { return !t.ok; });
  dl(list, "To tidy", function (dd) {
    if (!D.tidy.length) { dd.textContent = "none"; return; }
    var ul = add(dd, mk("ul", { "class": "plain" }));
    if (gone.length) { add(ul, mk("li", {}, "can remove: " + gone.map(function (t) { return t.name; }).join(", "))); }
    stay.forEach(function (t) { add(ul, mk("li", { "class": "muted" }, t.name + " — kept: " + t.why)); });
  });
  var marked = D.sides.filter(function (s) { return s.flags.filter(function (f) { return f.indexOf("shipped:") !== 0; }).length; });
  if (marked.length) {
    dl(list, "Flags", function (dd) {
      var ul = add(dd, mk("ul", { "class": "plain" }));
      marked.forEach(function (s) {
        add(ul, mk("li", { "class": "warn" }, s.name + ": " + s.flags.filter(function (f) { return f.indexOf("shipped:") !== 0; }).map(flagText).join(", ")));
      });
    });
  }
  if (D.suspects.length) {
    dl(list, "Suspect", function (dd) {
      var ul = add(dd, mk("ul", { "class": "plain" }));
      D.suspects.forEach(function (c) { add(ul, mk("li", { "class": "warn" }, c.name + " — " + c.key + " " + c.commit)); });
    });
  }
  // Each reached milestone with the sides it shipped, folded: opening it shows them all.
  var loaded = reached.slice().sort(function (a, b) { return vkey(b.version) - vkey(a.version); }).filter(function (m) {
    return past.some(function (s) { return sideVer(s) === m.version; });
  });
  if (loaded.length) {
    dl(list, "Reached milestones", function (dd) {
      loaded.forEach(function (m) {
        var mine = past.filter(function (s) { return sideVer(s) === m.version; });
        var box = add(dd, mk("details", { "class": "ms" }));
        add(box, mk("summary", {}, m.version + (m.name ? " " + m.name : "") + " · " + (mmdd(m.date || "") || "-") + " · side branches " + mine.length));
        var ul = add(box, mk("ul", { "class": "plain" }));
        mine.forEach(function (s) {
          var li = add(ul, mk("li"));
          var b = add(li, mk("button", { type: "button", "class": "link" }, s.mark + " " + s.name));
          b.addEventListener("click", function () { select(s, null); });
        });
      });
    });
  }
  add(bundle, mk("div", { "class": "foot" }, "Stale facts " + D.stale + " · dropped · superseded " + D.dropped));

  function showDetail(s) {
    detail.textContent = "";
    if (!s) { add(detail, mk("p", { "class": "muted" }, "Click a side branch to open its commits · worktree · ledger IDs per repo.")); return; }
    add(detail, mk("h2", {}, s.mark + " " + s.name));
    var l = add(detail, mk("dl"));
    dl(l, "Milestone", s.milestone);
    dl(l, "Repos", s.repos.join(", ") || "-");
    dl(l, "Start", s.start);
    dl(l, "Status", s.status);
    if (s.plan && s.plan !== "-") { dl(l, "plan", s.plan, "mono"); }
    if (s.flags.length) { dl(l, "Flags", s.flags.map(flagText).join(", ")); }
    s.detail.repos.forEach(function (r) {
      var box = add(detail, mk("div", { "class": "repo" }));
      add(box, mk("b", {}, r.key === "." ? "repo" : r.key));
      add(box, mk("div", { "class": "mono muted" }, r.worktree === "-" ? "no worktree" : r.worktree));
      var ul = add(box, mk("ul", { "class": "plain mono" }));
      if (!r.commits.length) { add(ul, mk("li", { "class": "muted" }, "no commit main lacks")); }
      r.commits.forEach(function (c) { add(ul, mk("li", {}, c)); });
    });
    if (s.detail.ledger.length) {
      var box = add(detail, mk("div", { "class": "repo" }));
      add(box, mk("b", {}, "Ledger"));
      var lu = add(box, mk("ul", { "class": "plain mono" }));
      s.detail.ledger.forEach(function (e) { add(lu, mk("li", {}, e.id + " " + e.state)); });
    }
  }
  showDetail(null);
}());
</script>
</body>
</html>
