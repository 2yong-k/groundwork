<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{project}} — design direction sheet</title>
<!-- Per-direction typefaces: add only the Google Fonts <link> each direction actually uses (@font-face if self-hosted). Include a body typeface for non-Latin text (e.g. Korean), if any. -->
<style>
/* ===== Sheet chrome (neutral, not under evaluation) ===== */
:root{--sheet-bg:#f4f4f2;--sheet-text:#222;--sheet-line:#d6d6d2;--sheet-muted:#6b6b66}
[data-theme="dark"]{--sheet-bg:#141414;--sheet-text:#e8e8e4;--sheet-line:#333;--sheet-muted:#9a9a94}
html{background:var(--sheet-bg)}
body{margin:0;background:var(--sheet-bg);color:var(--sheet-text);font:13px/1.5 ui-monospace,Menlo,monospace}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--sheet-line);position:sticky;top:0;background:var(--sheet-bg);z-index:2}
.sheet-head button{font:inherit;padding:6px 10px;border:1px solid var(--sheet-line);background:transparent;color:inherit;cursor:pointer}
.directions{display:grid;grid-template-columns:1fr;gap:24px;padding:16px}
@media(min-width:1440px){.directions{grid-template-columns:repeat(3,1fr)}}
.dir-meta{padding:4px 0 10px;color:var(--sheet-muted);border-bottom:1px dashed var(--sheet-line);margin-bottom:12px}
.dir-meta h2{margin:0 0 4px;font-size:13px;color:var(--sheet-text)}
.swatches{display:flex;gap:6px;margin-top:8px}.swatches i{display:block;width:28px;height:18px;border:1px solid var(--sheet-line)}
.swatches i:nth-child(1){background:var(--bg)}.swatches i:nth-child(2){background:var(--surface)}.swatches i:nth-child(3){background:var(--text)}
.swatches i:nth-child(4){background:var(--text-muted)}.swatches i:nth-child(5){background:var(--line)}.swatches i:nth-child(6){background:var(--accent)}
.swatches i:nth-child(7){background:var(--tone-positive-fg)}.swatches i:nth-child(8){background:var(--tone-warn-fg)}.swatches i:nth-child(9){background:var(--tone-danger-fg)}

/* ===== Sample screen: below uses only direction tokens (--bg etc.). No values typed in directly ===== */
.sample{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--text-base);line-height:var(--leading-normal);letter-spacing:var(--tracking-normal);border:1px solid var(--sheet-line)}
.nav{display:flex;align-items:center;gap:var(--space-6);padding:var(--space-3) var(--space-6);border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-size:var(--text-lg);letter-spacing:var(--tracking-tight)}
.nav a{color:var(--text-muted);text-decoration:none;font-size:var(--text-sm)}
.link{color:var(--link);text-decoration:underline}
.accent-text{color:var(--accent-text)}.accent-edge{border:1px solid var(--accent-border)}
.nav .spacer{flex:1}
.hero{padding:var(--space-12) var(--space-6) var(--space-8);border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--font-display);font-size:var(--text-3xl);line-height:var(--leading-tight);letter-spacing:var(--tracking-tight);margin:0 0 var(--space-3);max-width:24ch}
.hero p{color:var(--text-muted);max-width:52ch;margin:0 0 var(--space-6)}
.actions{display:flex;gap:var(--space-2);flex-wrap:wrap}
.btn{font:inherit;font-size:var(--text-sm);padding:var(--space-2) var(--space-4);border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;background:transparent;color:var(--text);transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.btn:focus-visible,.link:focus-visible,.is-focus{outline:var(--focus-width) solid var(--focus);outline-offset:var(--focus-offset)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{border-color:var(--line-strong)}
.btn-ghost{color:var(--text-muted)}
.btn-danger{background:var(--tone-danger-bg);color:var(--tone-danger-fg);border-color:var(--tone-danger-fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.section{padding:var(--space-8) var(--space-6);border-bottom:1px solid var(--line)}
.section h2{font-family:var(--font-display);font-size:var(--text-xl);line-height:var(--leading-tight);margin:0 0 var(--space-4)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--space-4)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-4)}
.card h3{font-size:var(--text-base);margin:0 0 var(--space-1)}
.card p{margin:0 0 var(--space-2);font-size:var(--text-sm)}
.meta{font-size:var(--text-xs);color:var(--text-muted)}
.chip{display:inline-block;font-size:var(--text-xs);line-height:1.6;padding:0 var(--space-2);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--text-muted)}
.chip-ok{color:var(--tone-positive-fg);background:var(--tone-positive-bg);border-color:var(--tone-positive-fg)}.chip-warn{color:var(--tone-warn-fg);background:var(--tone-warn-bg);border-color:var(--tone-warn-fg)}.chip-bad{color:var(--tone-danger-fg);background:var(--tone-danger-bg);border-color:var(--tone-danger-fg)}
.tone-neutral{color:var(--tone-neutral-fg);background:var(--tone-neutral-bg)}.tone-info{color:var(--tone-info-fg);background:var(--tone-info-bg)}.tone-positive{color:var(--tone-positive-fg);background:var(--tone-positive-bg)}.tone-warn{color:var(--tone-warn-fg);background:var(--tone-warn-bg)}.tone-danger{color:var(--tone-danger-fg);background:var(--tone-danger-bg)}
.tones{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}.tones span{font-size:var(--text-xs);padding:0 var(--space-2);border-radius:var(--radius-sm);line-height:1.6}
.skeleton{height:var(--space-4);border-radius:var(--radius-sm);background:var(--skeleton);margin:var(--space-2) 0;max-width:260px}
.form{display:grid;gap:var(--space-4);max-width:420px}
.field label{display:block;font-size:var(--text-sm);margin-bottom:var(--space-1)}
.field input,.field select{font:inherit;width:100%;box-sizing:border-box;padding:var(--space-2) var(--space-3);background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:var(--radius-sm)}
.field input:focus-visible,.field select:focus-visible{outline:var(--focus-width) solid var(--focus);outline-offset:var(--focus-offset)}
.field .help{font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-1)}
.field.error input{border-color:var(--tone-danger-fg)}.field.error .help{color:var(--tone-danger-fg)}
.check{display:flex;gap:var(--space-2);align-items:center;font-size:var(--text-sm)}
table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
th,td{text-align:left;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--text-muted);font-weight:500;font-size:var(--text-xs)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono,var(--font-body))}
.empty{padding:var(--space-8);text-align:center;color:var(--text-muted);border:1px dashed var(--line);border-radius:var(--radius-md)}
.empty strong{display:block;color:var(--text);margin-bottom:var(--space-1)}
.type-scale div{font-family:var(--font-display);line-height:1.2;margin:var(--space-1) 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footer{padding:var(--space-6);font-size:var(--text-xs);color:var(--text-muted)}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header class="sheet-head">
  <div>{{project}} — three design directions · the three are the same screen, only the tokens differ · look at both light/dark</div>
  <button type="button" id="theme-toggle">Switch to dark mode</button>
</header>

<!-- One set of the sample screen. Cloned into the three directions automatically. -->
<template id="sample">
  <div class="sample">
    <nav class="nav"><span class="brand">{{brand}}</span><a href="#">{{nav_1}}</a><a href="#">{{nav_2}}</a><a href="#">{{nav_3}}</a><span class="spacer"></span><button class="btn btn-primary" type="button">{{nav_cta}}</button></nav>
    <section class="hero"><h1>{{hero_title}}</h1><p>{{hero_sub}}</p><div class="actions"><button class="btn btn-primary" type="button">{{cta_primary}}</button><button class="btn btn-secondary" type="button">{{cta_secondary}}</button></div></section>
    <section class="section"><h2>{{cards_heading}}</h2><div class="cards">
      <article class="card"><h3>{{card_1_title}}</h3><p>{{card_1_body}}</p><span class="meta">{{card_1_meta}}</span></article>
      <article class="card"><h3>{{card_2_title}}</h3><p>{{card_2_body}}</p><span class="chip chip-ok">{{card_2_status}}</span></article>
      <article class="card"><h3>{{card_3_title}}</h3><p>{{card_3_body}}</p><span class="meta">{{card_3_meta}}</span></article>
    </div></section>
    <section class="section"><h2>{{form_heading}}</h2><form class="form" onsubmit="return false">
      <div class="field"><label>{{field_1_label}}</label><input placeholder="{{field_1_placeholder}}"><div class="help">{{field_1_help}}</div></div>
      <div class="field error"><label>{{field_2_label}}</label><input value="{{field_2_bad_value}}"><div class="help">{{field_2_error}}</div></div>
      <div class="field"><label>{{field_3_label}}</label><select><option>{{field_3_opt_1}}</option><option>{{field_3_opt_2}}</option></select></div>
      <label class="check"><input type="checkbox"> {{checkbox_label}}</label>
      <div class="actions"><button class="btn btn-primary" type="submit">{{form_submit}}</button><button class="btn btn-ghost" type="button">{{form_cancel}}</button></div>
    </form></section>
    <section class="section"><h2>{{table_heading}}</h2><table>
      <thead><tr><th>{{col_1}}</th><th>{{col_2}}</th><th class="num">{{col_3_num}}</th><th>{{col_4_status}}</th></tr></thead>
      <tbody>
        <tr><td>{{r1c1}}</td><td class="meta">{{r1c2}}</td><td class="num">{{r1c3}}</td><td><span class="chip chip-ok">{{r1_status}}</span></td></tr>
        <tr><td>{{r2c1}}</td><td class="meta">{{r2c2}}</td><td class="num">{{r2c3}}</td><td><span class="chip chip-warn">{{r2_status}}</span></td></tr>
        <tr><td>{{r3c1}}</td><td class="meta">{{r3c2}}</td><td class="num">{{r3c3}}</td><td><span class="chip chip-bad">{{r3_status}}</span></td></tr>
      </tbody></table></section>
    <section class="section"><h2>Button states</h2><div class="actions"><button class="btn btn-primary" type="button">Primary</button><button class="btn btn-secondary" type="button">Secondary</button><button class="btn btn-ghost" type="button">Ghost</button><button class="btn btn-danger" type="button">Destructive</button><button class="btn btn-primary" type="button" disabled>Disabled</button></div></section>
    <section class="section"><h2>Link · focus · tones · loading</h2>
      <p><a class="link" href="#">Link</a> · <span class="accent-text">Accent text</span> · <span class="accent-edge" style="padding:0 var(--space-2)">Accent border</span> · <button class="btn btn-secondary is-focus" type="button">Focus</button></p>
      <div class="tones"><span class="tone-neutral">neutral</span><span class="tone-info">info</span><span class="tone-positive">positive</span><span class="tone-warn">warn</span><span class="tone-danger">danger</span></div>
      <div class="skeleton"></div><div class="skeleton" style="width:60%"></div>
    </section>
    <section class="section"><div class="empty"><strong>{{empty_title}}</strong>{{empty_action}}</div></section>
    <section class="section type-scale"><h2>Type scale</h2>
      <div style="font-size:var(--text-3xl)">{{type_sample}}</div><div style="font-size:var(--text-2xl)">{{type_sample}}</div><div style="font-size:var(--text-xl)">{{type_sample}}</div><div style="font-size:var(--text-lg)">{{type_sample}}</div>
      <div style="font-size:var(--text-base);font-family:var(--font-body)">{{type_sample_body}}</div><div style="font-size:var(--text-sm);font-family:var(--font-body)">{{type_sample_body}}</div><div style="font-size:var(--text-xs);font-family:var(--font-body)">{{type_sample_body}}</div>
    </section>
    <footer class="footer">{{footer}}</footer>
  </div>
</template>

<main class="directions">
  <!-- Each direction: fill every light/dark value, with variable names 1:1 with the color keys of design/tokens.json. Carry the chosen direction's values as they are into design/tokens.json and generate tokens.css (web) · theme.ts (native) with build-tokens.mjs. -->
  <section class="dir" id="dir-a">
    <style>
      #dir-a{--bg:;--surface:;--surface-raised:;--text:;--text-muted:;--line:;--line-strong:;--accent:;--on-accent:;--accent-text:;--accent-border:;--link:;--focus:;--skeleton:;--tone-neutral-fg:;--tone-neutral-bg:;--tone-info-fg:;--tone-info-bg:;--tone-positive-fg:;--tone-positive-bg:;--tone-warn-fg:;--tone-warn-bg:;--tone-danger-fg:;--tone-danger-bg:;
        --font-display:;--font-body:;--font-mono:;--text-xs:;--text-sm:;--text-base:;--text-lg:;--text-xl:;--text-2xl:;--text-3xl:;--text-min:12px;--leading-tight:;--leading-normal:;--tracking-tight:;--tracking-normal:;
        --space-1:;--space-2:;--space-3:;--space-4:;--space-6:;--space-8:;--space-12:;--space-16:;--radius-sm:;--radius-md:;--shadow-1:;--shadow-2:;--dur-fast:;--dur-base:;--dur-exit:;--ease-out:;--skeleton-dur:1400ms;--focus-width:2px;--focus-offset:2px;--container:;--gutter:16px}
      [data-theme="dark"] #dir-a{--bg:;--surface:;--surface-raised:;--text:;--text-muted:;--line:;--line-strong:;--accent:;--on-accent:;--accent-text:;--accent-border:;--link:;--focus:;--skeleton:;--tone-neutral-fg:;--tone-neutral-bg:;--tone-info-fg:;--tone-info-bg:;--tone-positive-fg:;--tone-positive-bg:;--tone-warn-fg:;--tone-warn-bg:;--tone-danger-fg:;--tone-danger-bg:;--shadow-1:;--shadow-2:}
    </style>
    <div class="dir-meta"><h2>A · {{direction_a_name}}</h2>{{direction_a_intent}}<div class="swatches"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  </section>

  <section class="dir" id="dir-b">
    <style>
      #dir-b{--bg:;--surface:;--surface-raised:;--text:;--text-muted:;--line:;--line-strong:;--accent:;--on-accent:;--accent-text:;--accent-border:;--link:;--focus:;--skeleton:;--tone-neutral-fg:;--tone-neutral-bg:;--tone-info-fg:;--tone-info-bg:;--tone-positive-fg:;--tone-positive-bg:;--tone-warn-fg:;--tone-warn-bg:;--tone-danger-fg:;--tone-danger-bg:;
        --font-display:;--font-body:;--font-mono:;--text-xs:;--text-sm:;--text-base:;--text-lg:;--text-xl:;--text-2xl:;--text-3xl:;--text-min:12px;--leading-tight:;--leading-normal:;--tracking-tight:;--tracking-normal:;
        --space-1:;--space-2:;--space-3:;--space-4:;--space-6:;--space-8:;--space-12:;--space-16:;--radius-sm:;--radius-md:;--shadow-1:;--shadow-2:;--dur-fast:;--dur-base:;--dur-exit:;--ease-out:;--skeleton-dur:1400ms;--focus-width:2px;--focus-offset:2px;--container:;--gutter:16px}
      [data-theme="dark"] #dir-b{--bg:;--surface:;--surface-raised:;--text:;--text-muted:;--line:;--line-strong:;--accent:;--on-accent:;--accent-text:;--accent-border:;--link:;--focus:;--skeleton:;--tone-neutral-fg:;--tone-neutral-bg:;--tone-info-fg:;--tone-info-bg:;--tone-positive-fg:;--tone-positive-bg:;--tone-warn-fg:;--tone-warn-bg:;--tone-danger-fg:;--tone-danger-bg:;--shadow-1:;--shadow-2:}
    </style>
    <div class="dir-meta"><h2>B · {{direction_b_name}}</h2>{{direction_b_intent}}<div class="swatches"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  </section>

  <section class="dir" id="dir-c">
    <style>
      #dir-c{--bg:;--surface:;--surface-raised:;--text:;--text-muted:;--line:;--line-strong:;--accent:;--on-accent:;--accent-text:;--accent-border:;--link:;--focus:;--skeleton:;--tone-neutral-fg:;--tone-neutral-bg:;--tone-info-fg:;--tone-info-bg:;--tone-positive-fg:;--tone-positive-bg:;--tone-warn-fg:;--tone-warn-bg:;--tone-danger-fg:;--tone-danger-bg:;
        --font-display:;--font-body:;--font-mono:;--text-xs:;--text-sm:;--text-base:;--text-lg:;--text-xl:;--text-2xl:;--text-3xl:;--text-min:12px;--leading-tight:;--leading-normal:;--tracking-tight:;--tracking-normal:;
        --space-1:;--space-2:;--space-3:;--space-4:;--space-6:;--space-8:;--space-12:;--space-16:;--radius-sm:;--radius-md:;--shadow-1:;--shadow-2:;--dur-fast:;--dur-base:;--dur-exit:;--ease-out:;--skeleton-dur:1400ms;--focus-width:2px;--focus-offset:2px;--container:;--gutter:16px}
      [data-theme="dark"] #dir-c{--bg:;--surface:;--surface-raised:;--text:;--text-muted:;--line:;--line-strong:;--accent:;--on-accent:;--accent-text:;--accent-border:;--link:;--focus:;--skeleton:;--tone-neutral-fg:;--tone-neutral-bg:;--tone-info-fg:;--tone-info-bg:;--tone-positive-fg:;--tone-positive-bg:;--tone-warn-fg:;--tone-warn-bg:;--tone-danger-fg:;--tone-danger-bg:;--shadow-1:;--shadow-2:}
    </style>
    <div class="dir-meta"><h2>C · {{direction_c_name}}</h2>{{direction_c_intent}}<div class="swatches"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  </section>
</main>

<script>
  // Clone the sample screen into the three directions — this guarantees by structure that the three are "the same screen"
  const tpl = document.getElementById('sample');
  document.querySelectorAll('.dir').forEach(d => d.appendChild(tpl.content.cloneNode(true)));
  const root = document.documentElement, btn = document.getElementById('theme-toggle');
  const apply = t => { root.dataset.theme = t; btn.textContent = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'; };
  apply(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  btn.addEventListener('click', () => apply(root.dataset.theme === 'dark' ? 'light' : 'dark'));
</script>
</body>
</html>
